[package]
name = "libmql"
version = "0.2.0"
edition = "2024"
description = "Parser and solver-independent semantic IR for the Major Query Language"
repository = "https://github.com/mrodz/major-requirement-parser"
readme = "../README.md"

[dependencies]
anyhow = "1.0.100"
lazy_static = "1.5.0"
pest = "2.8.3"
pest_derive = "2.8.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
strsim = "0.11.1"
visibility = "0.1.1"
